# --- Stage 1A.1 (2026-11-11): measures written before any dossier. See SCORECARD.md,
# "How rows 1c and 1e are measured". Every rule string below appears word for word in that
# section, and a test checks it.

[definition.1c]
written_on = "2026-11-11"
denominator = "Every claim the model submits that cites at least one fact or passage ID, whatever type the model gives it, counted once per claim, per model, pooled over the 20 gate dossiers. Claims refused by the numbers rule stay in the count as not verified."
verified = "A claim is verified when every number, passage and text value rendered in it matches its fact, every fact matches the content-hashed source copy saved at fetch time, and the claim's own words agree with its cited facts. One failed check makes the whole claim unverified. The rate is verified claims divided by counted claims, with the per-ticker rates beside it."
number_match = "Code renders every figure to at least three significant figures, or all its digits if the source value has fewer. The figure shown is read back after normalising currency signs, thousands separators, bracketed negatives, percent signs and scale words, and must equal the source value rounded to the precision shown: the difference may be at most half a unit in the last digit shown. Company, metric, period and unit must match exactly. A derived value is recomputed from its archived inputs and held to the same rule."
passage_match = "The passage shown must equal the archived span exactly after Unicode NFKC normalisation, collapsing runs of white space to one space, and making curly quotes and dashes plain. Case and every other character must match, and the span's SHA-256 must equal the archived hash. There is no partial or fuzzy matching, and no elision."
text_match = "A text value (an auditor, an executive, a segment name, an 8-K item type, a date) must equal its source value exactly after the passage normalisation."
words_match = "Code reads the claim's own words with fixed patterns: periods (Q1 to Q4, H1 and H2, FY or fiscal followed by a year, and four-digit years), companies (a registered name in SEC's company list, or a ticker written in capitals as a whole word; a ticker that is also an English word, such as T or ALL, counts only inside parentheses or after a $ sign), scale and unit words (thousand, million, billion, percent, basis points, currency names and signs), and metric names from a fixed vocabulary mapped to XBRL concepts. Matching is case-sensitive and on whole words. Each item is checked on its own: every period, company, unit and metric the words name must be carried by at least one cited fact, so a named period that no cited fact has fails the claim even when its other items match. The patterns and the vocabulary are committed before the first gate dossier is built, and the run refuses to start unless their hash matches the one recorded in the run record."
planted_categories = ["altered number", "altered quote", "wrong period", "wrong unit", "wrong company", "wrong metric"]
planted_per_category = 25
planted_seed = 2026111103
planted_rule = "Each change is larger than the matching tolerance: a figure moves by at least 5%, and a unit by a factor of 100 or 1,000. A planted wrong period, company or metric swaps the cited fact for a genuine one that differs in that respect while the claim's words stay the same, and is drawn only from claims whose words name that thing. If fewer than 25 claims are eligible for a category, all eligible claims are used and the count is reported."
planted_report = "The false-accept rate, per category and overall, is reported beside row 1c with its one-sided Clopper-Pearson 95% upper bound. Any accepted planted claim is a checker bug and is fixed before the 1A gate is read."

[definition.1e]
written_on = "2026-11-11"
audit_tickers = ["AAPL", "NVDA", "MSFT", "GOOGL", "AMZN"]
audit_tickers_rule = "The five largest US companies by market value on 2026-11-11, as chosen in the approved Stage 1 plan."
claims = 100
claims_per_ticker = 20
sampler_seed = 2026111102
sample = "A fixed sample, not a sequential one, drawn after the dossiers are frozen and their hashes recorded with the marks. One Python random.Random generator, seeded with the sampler seed, takes the tickers in the order listed and, for each, draws sample(sorted claim IDs, 20) from the claims shown in that dossier, all claim types. If a dossier shows fewer than 20 claims, all of them are taken and the shortfall is not topped up. The number of withheld claims in each audit dossier is reported beside row 1e."
method = "The one-sided Clopper-Pearson 95% upper bound on the error rate, computed on the number of claims actually marked."
confidence = 0.95
bound_below = 0.05
max_wrong = 1
rubric = [
    "A fact claim is right only if each cited fact is the right company, metric, period and unit for what the sentence says.",
    "The sentence's own words (direction, comparison, size words such as \"doubled\") must agree with the values shown.",
    "An estimate or forecast claim is right if it is labelled as one and its cited facts are the ones it says it rests on.",
    "An opinion claim is wrong if its cited facts do not support it.",
    "A claim the marker cannot judge is marked wrong.",
]
new_to_me = "While marking, the marker may flag a claim as new to them. This half of the pass line passes if at least one flagged claim is also marked right. The flags are saved with the marks."

[gate_set.1a]
rows = ["1a", "1b", "1c", "1d", "4c"]
size = 20
seed = 2026111101
drawn_on = "2026-11-11"
universe_source = "sp500_constituents_2026-11-05.csv"
universe_sha256 = "b4c4f6b90e6fa7b94fd7c32e5678d1b9dfb1bf686211ae458cda9ec58da8b0cf"
sectors = ["Communication Services", "Energy", "Financials", "Information Technology"]
